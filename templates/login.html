<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - {{ brand_name }} Admin Console</title>
    <link rel="stylesheet" href="/static/style.css">
    {% if theme_css %}<style>{{ theme_css | safe }}</style>{% endif %}
</head>
<body class="login-page">
    <button type="button" class="theme-toggle login-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">Light Mode</button>

    <main class="login-panel">
        <div class="login-brand">
            <div class="logo-icon">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div>
                <h1>{{ brand_name }}</h1>
                <p>Security Console</p>
            </div>
        </div>

        <form id="loginForm" method="POST" action="/login">
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus maxlength="64" placeholder="Enter username" autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required maxlength="128" placeholder="Enter password" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary login-submit">Sign In</button>
        </form>

        <p class="login-notice">Authorised administrators only. Sign-ins and administrative actions are recorded.</p>
    </main>

    <script>
        function updateThemeLabel() {
            document.getElementById('themeToggleBtn').textContent =
                document.body.classList.contains('light-theme') ? 'Dark Mode' : 'Light Mode';
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeLabel();
        }

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        }
        updateThemeLabel();
    </script>
</body>
</html>
